server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Never framed. The OAuth consent page's Allow button must not be
    # clickjackable, and nothing in the app is meant to be embedded (the
    # bookmarklet opens a tab, it doesn't frame). `always` keeps the headers on
    # error responses; no location below sets add_header, which would
    # otherwise drop these.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;

    # ── Internal service-to-service endpoints — NOT for the public ──
    # These have no user auth and some return decrypted secrets
    # (/criteria/scraper/user-configs) or mutate data (/admin/internal/*).
    # In-cluster callers (scraper, ai-reviewer) reach tracker-api directly and
    # bypass this proxy, so denying them here is safe. `^~` outranks `/api/`.
    location ^~ /api/criteria/scraper/ { return 404; }
    location ^~ /api/jobs/internal/    { return 404; }
    location ^~ /api/admin/internal/   { return 404; }
    # /keys/internal/{user_id}/... returns DECRYPTED provider API keys with no
    # auth (ai-reviewer fetches them in-cluster, bypassing this proxy). Never
    # reachable from the public. (App-level X-Internal-Token enforcement is the
    # durable follow-up; this block is the immediate hard barrier.)
    location ^~ /api/keys/internal/    { return 404; }
    # /agent/config returns DECRYPTED LLM key + email creds. Per H6a it is only
    # used by the in-cluster (cloud) agent via the direct path; self-hosted local
    # agents use their own local .env creds. Block it from the public proxy.
    # The rest of /agent/* stays reachable (X-Agent-Key auth).
    location = /api/agent/config       { return 404; }
    # /agent/cloud/* are internal-token enumeration endpoints that hand out
    # decrypted per-user creds — in-cluster only, same posture as /agent/config.
    location ^~ /api/agent/cloud/      { return 404; }

    # ── OAuth authorization-server metadata (RFC 8414). AI assistants read it
    # at the issuer's well-known path; the issuer is this origin, so the SPA
    # host must answer. The endpoints it names live under /api/oauth/ (through
    # the proxy below) and /oauth/authorize (the SPA consent page).
    location = /.well-known/oauth-authorization-server {
        proxy_pass         http://jobradar-tracker-api/oauth/metadata;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── MCP connector (services/mcp-connector) — the URL users paste into Claude,
    # ChatGPT, Gemini or Grok is https://<host>/mcp, and its OAuth discovery
    # document lives at the RFC 9728 well-known paths. Streamable HTTP: no
    # buffering, so a streamed reply isn't held back. 95 s as for /api/.
    location = /mcp {
        proxy_pass         http://jobradar-mcp-connector:8002/mcp;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 95s;
        proxy_send_timeout 95s;
    }
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass         http://jobradar-mcp-connector:8002;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Block the no-auth AI-review write endpoint from the public.
    # ai-reviewer posts scores in-cluster (direct); the frontend never calls it.
    location ~ ^/api/jobs/[^/]+/ai-review$ { return 404; }

    # ── POST /jobs is the scraper-only (no-auth) write endpoint. Allow the
    # authenticated GET /jobs list, deny public writes (scraper posts in-cluster).
    location = /api/jobs {
        limit_except GET HEAD { deny all; }
        proxy_pass         http://jobradar-tracker-api/jobs;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Internal-User-Id "";   # never honored from public
        proxy_set_header   X-Internal-Token "";     # cloud agent auth — in-cluster only
        proxy_set_header   X-User-Id "";            # cloud per-user id — in-cluster only
    }

    # ── API proxy — /api/* → tracker-api (prefix stripped) ───────
    location /api/ {
        proxy_pass         http://jobradar-tracker-api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Strip internal-trust headers: get_current_user trusts X-Internal-User-Id
        # to act as any user, and get_agent_writer trusts X-Internal-Token + X-User-Id
        # for the cloud per-user path. Only in-cluster callers (which bypass this
        # proxy) may set these; the public never can.
        proxy_set_header   X-Internal-User-Id "";
        proxy_set_header   X-Internal-Token "";
        proxy_set_header   X-User-Id "";
        proxy_pass_request_headers on;

        # AI generation is slow by nature — interview prep with a large writing
        # skill measured ~73s against nginx's 60s default, so nginx returned 504
        # thirteen seconds BEFORE the backend finished and saved a perfectly good
        # answer. The user saw "Generation failed" for work that had succeeded.
        #
        # 95s, not higher: Cloudflare cuts the connection at 100s on this plan and
        # nothing we set here changes that. Staying just under means WE time out
        # first and return our own error rather than Cloudflare's generic page.
        # A generation that genuinely needs longer than 100s can't be fixed here
        # at all — that needs the request to become a background job.
        proxy_read_timeout    95s;
        proxy_send_timeout    95s;
        proxy_connect_timeout 10s;
    }

    # ── React SPA — serve index.html for all client-side routes ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
