apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobradar-tracker-api
  namespace: jobradar
  labels:
    app: tracker-api
    project: jobradar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tracker-api
  template:
    metadata:
      labels:
        app: tracker-api
    spec:
      # Research and résumé tailoring run inside this process after the response
      # (app/generation_jobs.py): a run is 30–75 s, parse + tailor up to ~150 s.
      # uvicorn finishes in-flight work on SIGTERM, but the default 30 s grace
      # would SIGKILL it first and the user's run would die with a deploy. The
      # pod exits as soon as it is idle, so this costs nothing when nothing is
      # running.
      terminationGracePeriodSeconds: 180
      containers:
        - name: tracker-api
          # Image tag is overridden by CI via `kubectl set image` on every deploy.
          # Using :staging as the base default so kubectl apply never causes InvalidImageName.
          image: ghcr.io/duaneoca/jobradar-tracker-api:staging
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: tracker-api-config
            - secretRef:
                name: tracker-api-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 45
            periodSeconds: 30
