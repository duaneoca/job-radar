apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobradar-ai-reviewer
  namespace: jobradar
  labels:
    app: ai-reviewer
    project: jobradar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-reviewer
  template:
    metadata:
      labels:
        app: ai-reviewer
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: ai-reviewer
          # Image tag is overridden by CI via `kubectl set image` on every deploy.
          image: ghcr.io/duaneoca/jobradar-ai-reviewer:staging
          # Pinned to one fork. Celery defaults concurrency to the CPU count (2 on
          # this node) and each fork loads litellm — roughly 150Mi apiece — which
          # exceeded the old 256Mi limit as soon as both were busy. Light traffic
          # never ran two at once; the first real backlog (843 queued jobs) OOM-
          # killed the worker into CrashLoopBackOff in production.
          #
          # One fork rather than a bigger limit: the node is already at ~87% of its
          # memory limits, and scoring is I/O-bound waiting on the LLM API, so the
          # second fork bought little. Observed drain rate at concurrency=1 is
          # ~3.5 jobs/sec. Raise the memory limit BEFORE raising this.
          command:
            - celery
            - -A
            - app.main
            - worker
            - --loglevel=info
            - -Q
            - review
            - --concurrency=1
          envFrom:
            - configMapRef:
                name: tracker-api-config   # shares REDIS_URL and TRACKER_API_URL
          env:
            # Least-privilege: pull only the shared internal token (not the whole
            # tracker-api-secrets) to authenticate internal calls to tracker-api.
            - name: AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tracker-api-secrets
                  key: AGENT_INTERNAL_TOKEN
            # Deep memory profiling (tracemalloc). OFF here on purpose — it
            # roughly doubles allocation cost, so it is a diagnostic session, not
            # a running state. Per-task RSS deltas are logged regardless and are
            # free; this only adds allocation-site attribution.
            #
            #   kubectl -n jobradar-production set env deploy/jobradar-ai-reviewer MEMORY_PROFILE=1
            #   ... read `mem top growth` lines ...
            #   kubectl -n jobradar-production set env deploy/jobradar-ai-reviewer MEMORY_PROFILE-
            #
            # Note that setting it restarts the pod, which forks a fresh child at
            # its ~160Mi floor — so the leak has to accumulate again before the
            # report says anything. Leave it running for hours, not minutes.
            - name: MEMORY_PROFILE
              value: ""
          resources:
            requests:
              # Measured, not guessed: the worker sits at ~213Mi RSS while IDLE
              # with an empty queue — celery plus litellm's import graph. The old
              # 96Mi request was less than half of that, so the scheduler was
              # placing this pod on a completely wrong picture of its size.
              cpu: "50m"
              memory: "256Mi"
            limits:
              # Was 256Mi, i.e. BELOW the idle footprint, so any actual review
              # tipped it over: 157 OOMKills in 42 hours, one every ~16 minutes.
              # Raising concurrency above 1 needs this raised again first — each
              # fork carries its own litellm.
              cpu: "500m"
              memory: "512Mi"
