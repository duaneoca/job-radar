apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobradar-ai-reviewer
  namespace: jobradar
  labels:
    app: ai-reviewer
    project: jobradar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-reviewer
  template:
    metadata:
      labels:
        app: ai-reviewer
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: ai-reviewer
          # Image tag is overridden by CI via `kubectl set image` on every deploy.
          image: ghcr.io/duaneoca/jobradar-ai-reviewer:staging
          # Pinned to one fork. Celery defaults concurrency to the CPU count (2 on
          # this node) and each fork loads litellm — roughly 150Mi apiece — which
          # exceeds the 256Mi limit below as soon as both are busy. Light traffic
          # never ran two at once; the first real backlog (843 queued jobs) OOM-
          # killed the worker into CrashLoopBackOff in production.
          #
          # One fork rather than a bigger limit: the node is already at ~87% of its
          # memory limits, and scoring is I/O-bound waiting on the LLM API, so the
          # second fork bought little. Observed drain rate at concurrency=1 is
          # ~3.5 jobs/sec. Raise the memory limit BEFORE raising this.
          command:
            - celery
            - -A
            - app.main
            - worker
            - --loglevel=info
            - -Q
            - review
            - --concurrency=1
          envFrom:
            - configMapRef:
                name: tracker-api-config   # shares REDIS_URL and TRACKER_API_URL
          env:
            # Least-privilege: pull only the shared internal token (not the whole
            # tracker-api-secrets) to authenticate internal calls to tracker-api.
            - name: AGENT_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tracker-api-secrets
                  key: AGENT_INTERNAL_TOKEN
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
