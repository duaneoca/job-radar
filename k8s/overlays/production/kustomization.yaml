apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: ""
namespace: jobradar-production

resources:
  - ../../base
  # Production only — staging data is disposable, so it gets no backup job.
  - backup-cronjob.yaml
  # Production only — staging is where things are expected to break, and mailing
  # about it would train the reader to ignore the mail.
  - log-digest-rbac.yaml
  - log-digest-cronjob.yaml

patches:
  # Override ingress with hostname + TLS for production
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: jobradar-ingress

# Production runs 2 replicas of the API
# Scale up here when traffic warrants it
